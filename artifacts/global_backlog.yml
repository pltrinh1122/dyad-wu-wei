- body: "## Intent&#10;Operator directed: 'Remove frontier_state.md physical lock\
    \ mechanism to eliminate Git push collisions and support true WIP=N fan-out. Implement\
    \ an ad-hoc orchestrator ledger that queries GitHub API for active nodes.'&#10;&#10;##\
    \ Rub Matrix&#10;**WHAT**: Gut all logic from 'kernel/agent_frontier.py' that\
    \ serializes tracking metadata to 'artifacts/frontier_state.md'. Replace it with\
    \ a GitHub API wrapper that infers active nodes by querying issues labeled 'status:\
    \ in-progress' assigned to current milestones.&#10;**WHY**: To structurally elevate\
    \ the node execution tracking out of the physical filesystem and into the native\
    \ GitHub issue/API layer, establishing the global project board as the single\
    \ source of truth for all concurrent Swarm activity.&#10;**SCOPE**: TBD&#10;&#10;##\
    \ Meta-Index\n- [x] #2298: Act - Gut Local Lock Ledger\n- [x] #2294: Reflect -\
    \ Gut Local Lock Ledger and Implement API-Driven Orchestrator for Swarm Fan-Out\
