- body: '## Goal

    Resolve the structural mechanisms that required manual intervention during the
    execution of Path 2168, specifically around DAG topological sorting, node aborting,
    and auto-locking invariants.


    ## Context (Manual Interventions Performed)

    During the execution of Path 2168, the following manual interventions were required
    to unseize the engine:

    1. **UnboundLocalError in daemon_nba.py**: API failure caused `open_path_issues`
    to be unbound, silencing fallback. (Hotfixed manually).

    2. **Aborting Nodes Orphans Them**: Running `./bin/node abort <id>` failed with
    `Status key ''open'' is not defined in node.yml`, preventing the restoration of
    the `backlog` label. I had to manually restore labels via `gh issue edit`.

    3. **Subagent Failed to Update Reflect Dependency**: When `agent-healer` added
    the `Act` node via `bin/backlog`, the `Reflect` node''s dependency was not updated,
    leaving it incorrectly unblocked. I manually updated the parent path body.

    4. **NBA Fallback Ignores DAG Topology**: Unmatched items (nodes belonging to
    paths not in `strategic_intent.yml`, like dynamic BUG intakes) are sorted purely
    by issue number. This caused the unblocked `Reflect` node (lower ID) to be prioritized
    over the newly created `Act` node (higher ID).

    5. **Auto-Locking Path Containers**: `bin/status` auto-acquired the `Path` container
    (2168, 2172) because they appeared in `unmatched_items`. This violates the invariant
    that Path containers should not be executed natively. I had to manually abort
    them.


    ## Changes

    1. Update `kernel/node_lifecycle.py` (or `node.yml`) to correctly map the `open`
    state to `status: todo` during an abort.

    2. Update `kernel/daemon_nba.py` to filter out issues with `Path:` in the title
    from the final `recommendations` list.

    3. Update `kernel/daemon_nba.py` to apply topological dependency checking (via
    `gh_graph_skill.get_next_nodes()`) to `unmatched_items` so that DAG structure
    is preserved even for non-strategic paths.

    4. Enhance `bin/backlog` (or `agent-healer` prompts) to intelligently update `Reflect`
    node dependencies when injecting `Act` nodes.


    ## Meta-Index

    - [ ] #2217: Act - Hotfix: Isolate Meta-Index parsing in gh_graph_skill

    - [ ] #2193: Act - Implement Universal NBA Topology Pass [Depends: 2186]

    - [ ] #2192: Act - Implement Terminal Reflect Invariant [Depends: 2186]

    - [ ] #2191: Act - Implement Abort Hygiene Fix [Depends: 2186]

    - [ ] #2187: Reflect - Remediate DAG Execution and NBA Fallback Invariants [Depends:
    2186]

    - [ ] #2186: Plan - Remediate DAG Execution and NBA Fallback Invariants [Depends:
    2185]

    - [ ] #2185: Harmonize - Remediate DAG Execution and NBA Fallback Invariants

    - [ ] Harmonize - Remediate DAG Execution and NBA Fallback Invariants

    - [ ] Plan - Remediate DAG Execution and NBA Fallback Invariants

    - [ ] Reflect - Remediate DAG Execution and NBA Fallback Invariants

    '
