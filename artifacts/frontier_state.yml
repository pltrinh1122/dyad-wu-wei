- name: 'Probe 153: Architectural Evaluation of Terminal vs Non-Terminal Node Abstraction'
  status: Completed
  learnings: Evaluated the benefit of abstracting nodes into Terminal (execution,
    leaf) and Non-Terminal (composite, path) base classes. This purely graph-theoretic
    abstraction decouples the Antigravity orchestration logic from the software development
    domain, allowing generic reuse across arbitrary domains like `agent-travel`. Queued
    Activity 156 to formally implement this abstraction.
  invariants:
  - '`Probe must not mutate functional logic`'
  - '`Terminal Node represents leaf/execution node`'
  - '`Non-Terminal Node represents composite/parent node`'
- name: 'Probe 159: Evaluate node plan-start and plan-finish commands'
  status: Completed
  learnings: Determined that planning must be a stateful, two-step protocol (`plan-start`
    and `plan-finish`) to prevent race conditions during prolonged multi-turn drafting
    sessions. `plan-start` acts as the immediate GH Label lock, while `plan-finish`
    finalizes the contract. This definitively hardens the SPAO WIP-N=1 invariant against
    parallel agentic collisions.
  invariants:
  - '`Probe must not mutate functional logic`'
  - '`plan-start applies status: in-progress lock immediately`'
  - '`plan-finish uploads final contract to Issue body`'
