strategic_goals:
- id: NS-0001
  title: Operational Leverage through Autonomous Reliability (North Star)
  operator_problem: The operator suffers from attention overhead and context-switching
    fatigue when guiding autonomous agents, preventing scale.
  constraints: The system must operate under real-time session limits, operator attention
    boundaries, and standard repository rules.
  falsification_signal: The ratio of operator attention time (conversation, reviews,
    debug gates) to completed backlog nodes increases over a 30-day window.
  status: Active
  prioritized_paths: []
- id: SG-0001
  title: Backlog Dynamics and Resource Budget Alignment
  operator_problem: The system wastes computational resources and LLM token budgets
    executing low-impact paths because backlog selection and path execution are decoupled
    from active strategic policies.
  constraints: Backlog prioritization must be evaluated deterministically during the
    SENSE phase using active ledger goals.
  falsification_signal: The agent spends resource/token budget on paths that are not
    prioritized in the strategic ledger.
  status: Active
  prioritized_paths:
  - 404
- id: SG-0002
  title: Gateless Autonomous Execution within Risk-Managed Sandbox
  operator_problem: The agent cannot execute autonomously because the lack of automated
    network egress isolation, process containment, and transaction rollback mechanics
    poses an unacceptable risk of codebase or workspace corruption.
  constraints: The sandbox must enforce hard CPU/memory limits, restrict network egress
    to an allowlist, and guarantee idempotent git tree state rollbacks.
  falsification_signal: The operator re-introduces manual human-in-the-loop review
    gates because the sandbox policies fail to isolate or rollback unsafe mutations.
  status: Active
  prioritized_paths: []
- id: SG-0003
  title: Preservation of Autonomous Velocity
  operator_problem: Autonomous agent velocity is degraded because non-deterministic
    (flaky) tests or slow validation runs trigger false-positive auto-rollbacks, stalling
    the agent in repeating repair loops.
  constraints: Validation test suites must execute completely offline, contain zero
    network dependencies, and run in under 60 seconds.
  falsification_signal: The agent's throughput (nodes completed per unit of time)
    decreases due to repeating rollback cycles caused by test flakiness or network
    timeouts.
  status: Active
  prioritized_paths:
  - 368
- id: SG-0004
  title: Efficient Intent-to-Goal Policy Communication
  operator_problem: Defining strategic goals and aligning on technical designs requires
    verbose, high-overhead conversational alignment loops, leading to operator decision
    fatigue.
  constraints: Intent must be communicated exclusively through structured policy definitions
    (strategic_intent.yml) with falsifiable metrics.
  falsification_signal: The operator spends more than 10% of their session time in
    interactive conversational turns rather than simple policy updates.
  status: Active
  prioritized_paths: []
- id: SG-0005
  title: Autonomous Knowledge Accrual
  operator_problem: The human attention required to guide the agent remains static
    because the agent cannot autonomously capture, codify, and apply lessons from
    its execution failures to future plans.
  constraints: Knowledge mutations under the kb/ directory must be verified for structural
    validity and must not violate immutable core axioms.
  falsification_signal: The average number of agent repair cycles on repeat error
    patterns does not decrease over subsequent sessions targeting the same domain.
  status: Active
  prioritized_paths: []
