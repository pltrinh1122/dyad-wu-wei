strategic_goals:
- id: NS-0001
  title: Synergistic Human-Agent Partnership (North Star - 1+1=3)
  operator_problem: Unilateral automation hard-caps the system's output at the limits
    of the agent's logic or the human's manual review bandwidth.
  constraints: The system must operate under real-time session limits, operator attention
    boundaries, and standard repository rules.
  falsification_signal: The dyad fails to achieve greater throughput and architectural
    stability than the operator working alone or the agent executing without oversight.
  status: Active
  prioritized_paths: []
- id: SG-0001
  title: Backlog Dynamics and Resource Budget Alignment
  operator_problem: The system wastes resources and the operator suffers from decision
    fatigue because the backlog selection model fails to dynamically translate strategic
    intent into agent backlog sequencing, leaving execution decoupled from collaborative
    policies.
  constraints: Backlog prioritization must be evaluated deterministically during the
    SENSE phase using active ledger goals.
  falsification_signal: The agent spends resource/token budget on paths that are not
    prioritized in the strategic ledger.
  status: Active
  prioritized_paths:
  - 404
- id: SG-0002
  title: Gateless Autonomous Execution within Risk-Managed Sandbox
  operator_problem: The dyad cannot delegate execution authority because the lack
    of automated sandbox safety boundaries forces the operator to act as a manual
    execution gatekeeper, stalling autonomous velocity due to safety anxiety.
  constraints: The sandbox must enforce hard CPU/memory limits, restrict network egress
    to an allowlist, and guarantee idempotent git tree state rollbacks.
  falsification_signal: The operator re-introduces manual human-in-the-loop review
    gates because the sandbox policies fail to isolate or rollback unsafe mutations.
  status: Active
  prioritized_paths: []
- id: SG-0003
  title: Preservation of Autonomous Velocity
  operator_problem: The collaborative velocity of the dyad is degraded because low-fidelity
    environmental feedback (flaky tests) triggers false rollbacks, dragging the operator
    back down to manual debugging and destroying trust in the agent's inner-loop verification.
  constraints: Validation test suites must execute completely offline, contain zero
    network dependencies, and run in under 60 seconds.
  falsification_signal: The agent's throughput (nodes completed per unit of time)
    decreases due to repeating rollback cycles caused by test flakiness or network
    timeouts.
  status: Active
  prioritized_paths:
  - 368
- id: SG-0004
  title: Efficient Intent-to-Goal Policy Communication
  operator_problem: The dyad fails to achieve high-level policy alignment because
    the communication interface requires verbose, low-abstraction conversational alignment
    loops, leading to operator decision fatigue and agent execution drift.
  constraints: Intent must be communicated exclusively through structured policy definitions
    (strategic_intent.yml) with falsifiable metrics.
  falsification_signal: The operator spends more than 10% of their session time in
    interactive conversational turns rather than simple policy updates.
  status: Active
  prioritized_paths: []
- id: SG-0005
  title: Autonomous Knowledge Accrual
  operator_problem: The dyad's collective intelligence remains static because the
    agent cannot autonomously capture, codify, and apply lessons from its execution
    failures to future plans, forcing the operator to repeatedly correct the same
    error patterns.
  constraints: Knowledge mutations under the kb/ directory must be verified for structural
    validity and must not violate immutable core axioms.
  falsification_signal: The average number of agent repair cycles on repeat error
    patterns does not decrease over subsequent sessions targeting the same domain.
  status: Active
  prioritized_paths: []
