name: "🔧 External Project Support Request"
description: "Request remedies, amendments, or tooling from the DZ-CIL engine for an external project workstation."
title: "[SUPPORT] "
labels: ["support", "external-project"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request support from the DZ-CIL engine when operating
        on an external project workstation with a read-only DZ-CIL clone.

  - type: dropdown
    id: ticket-type
    attributes:
      label: Ticket Type
      description: What kind of support is needed?
      options:
        - "Amendment — Domain Dao Digest rule correction, addition, or removal"
        - "Escalation — Blocking question requiring Operator guidance"
        - "Tooling — New skill, wrapper, or infrastructure needed in DZ-CIL"
        - "Retrospective — Session learnings to flow back to the engine Dao"
        - "Bug — DZ-CIL toolchain issue encountered during external project work"
    validations:
      required: true

  - type: input
    id: project-id
    attributes:
      label: Project Identifier
      description: "Short identifier for the external project (e.g., 'fl', 'acme-api')"
      placeholder: "project-id"
    validations:
      required: true

  - type: input
    id: digest-rule-id
    attributes:
      label: Related Digest Rule ID(s)
      description: "Addressable rule IDs from the project's Domain Dao Digest, if applicable (e.g., INV-024, CONV-008)"
      placeholder: "Leave blank if N/A"

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you doing when this came up? Reference the work package, spec, or task.
      placeholder: "During work package [X], while implementing [Y]..."
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Request
      description: What specific action, decision, or remedy is needed from the DZ-CIL engine?
    validations:
      required: true

  - type: textarea
    id: proposed-resolution
    attributes:
      label: Proposed Resolution (if any)
      description: "Agent's recommendation or suggested fix, if applicable."

  - type: dropdown
    id: blocking
    attributes:
      label: Is this blocking current work?
      options:
        - "Yes — cannot proceed without resolution"
        - "No — can continue, will batch with next session"
    validations:
      required: true

  - type: input
    id: session-id
    attributes:
      label: Session ID
      description: "Conversation or work session identifier for traceability."
