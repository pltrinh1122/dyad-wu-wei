name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: self-hosted
    env:
      GIT_CONFIG_GLOBAL: /dev/null

    steps:
    - uses: actions/checkout@v4

    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        ~/actions-runner/venv/bin/pytest
