timer_interval: 5m
audit_branches:
- main
rules:
- id: stale_pointer_check
  type: stale_active_node
  alert_level: FAILURE
  lightweight: true
- id: refresh-ci-venv
  type: file_modified
  file: requirements-dev.txt
  alert_level: FAILURE
  prompt_message: Refresh CI Venv (requirements-dev.txt changed)
- id: frontier-integrity
  type: frontier_integrity
  alert_level: FAILURE
  lightweight: true
- id: semantic_immune_system_scanner
  type: semantic_immune_system
- id: backlog_hygiene_auditor
  type: backlog_hygiene
  alert_level: NOTIFICATION
- id: orphaned_nodes_auditor
  type: orphaned_nodes
  alert_level: NOTIFICATION
- id: seizure_detector
  type: seizure_detection
  threshold: 3
  alert_level: FAILURE
- id: liveness_stall_detector
  type: liveness_stall
  stall_threshold_minutes: 15
  alert_level: FAILURE
- id: agent-md-changed
  type: file_modified
  file: AGENT.md
  alert_level: FAILURE
  create_intake: false
  prompt_message: "AGENT.md changed — agent (/exit) recommended to reload instructions"
- id: gemini-md-changed
  type: file_modified
  file: GEMINI.md
  alert_level: FAILURE
  create_intake: false
  prompt_message: "GEMINI.md changed — agent (/exit) recommended to reload instructions"

