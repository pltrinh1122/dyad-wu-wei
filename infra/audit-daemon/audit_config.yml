timer_interval: 5m
audit_branches:
- main
rules:
- id: sluice-gate-sensor
  type: pr_merged_monitor
  alert_level: NOTIFICATION
- id: stale_pointer_check
  type: stale_active_node
  alert_level: FAILURE
- id: refresh-ci-venv
  type: file_modified
  file: requirements-dev.txt
  alert_level: FAILURE
  prompt_message: Refresh CI Venv (requirements-dev.txt changed)
- id: frontier-integrity
  type: frontier_integrity
  alert_level: FAILURE
- id: synthesized-guard-5667bebb
  type: lexical_guard
  pattern: \bnode/390\-test\b
  alert_level: FAILURE
  prompt_message: 'Synthesized Lexical Guard: Forbidden term ''node/390-test'' detected
    (from failed test ''test_reflect_success'')'
- id: synthesized-guard-0859ae9f
  type: lexical_guard
  pattern: \bprune\b
  alert_level: FAILURE
  prompt_message: 'Synthesized Lexical Guard: Forbidden term ''prune'' detected (from
    failed test ''test_git_fetch_custom'')'
