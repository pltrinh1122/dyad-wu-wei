# agent_id: Canonical ROM identity declaration for this agent deployment.
# CONTRACT:
#   - Must match an entry in kb/WHAT-0062-agent-persona-ownership-index.md
#   - Is immutable per deployment (never overridden at runtime)
#   - Absence or mismatch MUST cause the persona enforcement gate to fail-closed
#   - Standard established by Path 591 (Activity 600), agent-SG5, SG-0005
# agent_id: agent-sg5

node_taxonomy:
  terminal:
    - activity
    - discovery
  non_terminal:
    - path

sense_hooks:
  - type: prompt_queue
    location: artifacts/prompt_backlog.yml
  - type: next_best_action
    repository: pltrinh1122/dyad-wu-wei
  - type: dm_inbox
    me: dyad-wu-wei

governance:
  spao_purity_enforcement: true
  sacred_files:
    - GEMINI.md
    - DYAD.md

domains:
  family_legacy:
    path: /mnt/shared_data/git_repos/family_legacy/main
    domain_dao_digest: artifacts/Domain_Dao_Digest_v0.1.md
    branch_prefix: solo/main/
    validation_hook: tools/repo content-parity
    auto_approve_labels:
      - forward-port
